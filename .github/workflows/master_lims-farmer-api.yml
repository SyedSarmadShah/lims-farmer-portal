
name: Build and deploy Django backend to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Upload Django backend
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_869BEBABF48C4B698E7A682020599954 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5121FF52D6B74F5C8BCF697AE739D4EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B40A050D986145A4BFE998F1B46E0A89 }}

      - name: Deploy Django backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: lims-farmer-api
          slot-name: Production
          package: .
